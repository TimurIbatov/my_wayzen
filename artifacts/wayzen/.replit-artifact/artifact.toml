kind = "web"
previewPath = "/"
title = "WayZen — Hidden Trails"
description = "A personalized travel guide to Uzbekistan’s hidden places, stories, maps, and routes for independent travelers."
version = "1.0.0"
id = "artifacts/wayzen"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22400

[services.development]
run = "pnpm --filter @workspace/wayzen run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wayzen", "run", "build" ]
serve = "static"
publicDir = "artifacts/wayzen/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22400"
BASE_PATH = "/"
